name: Build Champak Phone Remote APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "phone_remote/**"
      - ".github/workflows/champaks-phone-remote-apk.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone_remote
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms android --org live.learnwithchampak .
      - name: Android configuration
        run: python3 scripts/configure_android.py
      - name: Install packages
        run: flutter pub get
      - name: Build Android APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: champaks-phone-remote-apk
          path: phone_remote/build/app/outputs/flutter-apk/app-release.apk
