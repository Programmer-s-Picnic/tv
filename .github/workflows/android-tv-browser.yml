name: Build Android TV Browser

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-tv/**'
      - '.github/workflows/android-tv-browser.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-tv
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Champak-TV-Browser-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/Champak-TV-Browser-release-unsigned.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Champak-TV-Browser-APKs
          path: android-tv/dist/*.apk
          if-no-files-found: error
