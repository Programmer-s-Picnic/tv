name: champaks_tv_remote
description: Champak's TV Remote — Wi-Fi pairing and native Android TV control
publish_to: none
version: 1.6.1+18
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  path_provider: ^2.1.5
  speech_to_text: ^7.3.0
  record: ^6.2.1
  file_picker: ^10.3.3
  android_tv_remote:
    git:
      url: https://github.com/alexito8473/android_tv_remote.git
      ref: main
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#1255BD"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  min_sdk_android: 23
flutter:
  uses-material-design: true
