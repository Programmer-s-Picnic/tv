plugins {
    id 'com.android.application'
}

android {
    namespace 'live.learnwithchampak.tvbrowser'
    compileSdk 35

    defaultConfig {
        applicationId 'live.learnwithchampak.tvbrowser'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '1.2.2'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}
